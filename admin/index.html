<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Masscratch Admin</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --card: #fff;
      --text: #1d1d1f;
      --sub: #6e6e73;
      --accent: #0071e3;
      --border: rgba(0,0,0,0.1);
      --danger: #d70015;
      --ok: #248a3d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 1.5rem 1rem 3rem;
    }
    .wrap { max-width: 880px; margin: 0 auto; }
    h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.35rem; }
    .sub { color: var(--sub); font-size: 0.9rem; margin-bottom: 1.5rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.25rem 1.35rem;
      margin-bottom: 1rem;
    }
    label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--sub); margin-bottom: 0.35rem; }
    input, textarea, select {
      width: 100%;
      padding: 0.65rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      margin-bottom: 0.85rem;
      font-family: inherit;
      background: #fff;
      color: var(--text);
    }
    textarea { min-height: 90px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    @media (max-width: 600px) { .row { grid-template-columns: 1fr; } }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 0.4rem; border: none; border-radius: 12px; padding: 0.7rem 1.2rem;
      font-size: 0.9rem; font-weight: 600; cursor: pointer;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: rgba(0,0,0,0.06); color: var(--text); }
    .btn-danger { background: rgba(215,0,21,0.1); color: var(--danger); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
    .msg { font-size: 0.85rem; margin-top: 0.75rem; }
    .msg.err { color: var(--danger); }
    .msg.ok { color: var(--ok); }
    .hidden { display: none !important; }
    .item {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 0.75rem;
      background: #fafafa;
    }
    .item-title { font-weight: 700; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .tab {
      padding: 0.5rem 1rem; border-radius: 999px; border: 1px solid var(--border);
      background: #fff; cursor: pointer; font-weight: 600; font-size: 0.85rem;
    }
    .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .hint { font-size: 0.75rem; color: var(--sub); margin-bottom: 1rem; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- LOGIN -->
    <div id="loginView">
      <h1>Masscratch Admin</h1>
      <p class="sub">登入後可更新活動同福利內容</p>
      <div class="card">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" placeholder="masscratch@masscratch.top" />
        <label for="password">密碼</label>
        <input id="password" type="password" autocomplete="current-password" />
        <div class="actions">
          <button class="btn btn-primary" id="btnLogin">登入</button>
        </div>
        <p class="msg" id="loginMsg"></p>
      </div>
    </div>

    <!-- APP -->
    <div id="appView" class="hidden">
      <div class="topbar">
        <div>
          <h1>內容管理</h1>
          <p class="sub" id="whoami" style="margin:0"></p>
        </div>
        <button class="btn btn-secondary" id="btnLogout">登出</button>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="events">活動 Event</button>
        <button class="tab" data-tab="welfare">福利 Welfare</button>
      </div>

      <div id="panelEvents">
        <p class="hint">以下係<strong>已公開</strong>嘅活動。可改內容後「儲存」，或撳「刪除並發佈」即刻從公開頁移除。GitHub Pages 約 1–2 分鐘生效。</p>
        <div id="eventsList"></div>
        <div class="actions">
          <button class="btn btn-secondary" id="btnAddEvent">＋ 新增活動</button>
          <button class="btn btn-primary" id="btnSaveEvents">儲存活動</button>
        </div>
        <p class="msg" id="eventsMsg"></p>
      </div>

      <div id="panelWelfare" class="hidden">
        <p class="hint">以下係<strong>已公開</strong>嘅福利。可改內容後「儲存」，或撳「刪除並發佈」即刻從公開頁移除。</p>
        <h3 style="margin:0.5rem 0">組織福利</h3>
        <div id="orgList"></div>
        <div class="actions" style="margin-bottom:1.25rem">
          <button class="btn btn-secondary" id="btnAddOrg">＋ 新增組織</button>
        </div>
        <h3 style="margin:0.5rem 0">商戶優惠</h3>
        <div id="merchantList"></div>
        <div class="actions">
          <button class="btn btn-secondary" id="btnAddMerchant">＋ 新增商戶</button>
          <button class="btn btn-primary" id="btnSaveWelfare">儲存福利</button>
        </div>
        <p class="msg" id="welfareMsg"></p>
      </div>
    </div>
  </div>

  <script>
    /**
     * 改呢個 API 網址成你嘅 Worker 網域
     * 例如：https://masscratch-api.你的帳號.workers.dev
     * 或者：https://api.masscratch.top
     */
    const API_BASE = 'https://masscratch.iamcrushedcandle.workers.dev';

    let eventsData = [];
    let welfareData = { org: [], merchants: [] };

    const $ = (id) => document.getElementById(id);

    async function api(path, options = {}) {
      const res = await fetch(API_BASE + path, {
        credentials: 'include',
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
        ...options,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
      return data;
    }

    async function checkSession() {
      try {
        const me = await api('/api/me');
        if (me.authenticated) {
          showApp(me.email);
          await loadAll();
          return;
        }
      } catch (_) {}
      showLogin();
    }

    function showLogin() {
      $('loginView').classList.remove('hidden');
      $('appView').classList.add('hidden');
    }
    function showApp(email) {
      $('loginView').classList.add('hidden');
      $('appView').classList.remove('hidden');
      $('whoami').textContent = email || '';
    }

    $('btnLogin').onclick = async () => {
      $('loginMsg').textContent = '';
      $('loginMsg').className = 'msg';
      try {
        const data = await api('/api/login', {
          method: 'POST',
          body: JSON.stringify({
            email: $('email').value.trim(),
            password: $('password').value,
          }),
        });
        showApp(data.email);
        await loadAll();
      } catch (e) {
        $('loginMsg').textContent = e.message;
        $('loginMsg').className = 'msg err';
      }
    };

    $('btnLogout').onclick = async () => {
      try { await api('/api/logout', { method: 'POST' }); } catch (_) {}
      showLogin();
    };

    document.querySelectorAll('.tab').forEach((tab) => {
      tab.onclick = () => {
        document.querySelectorAll('.tab').forEach((t) => t.classList.remove('active'));
        tab.classList.add('active');
        const name = tab.dataset.tab;
        $('panelEvents').classList.toggle('hidden', name !== 'events');
        $('panelWelfare').classList.toggle('hidden', name !== 'welfare');
      };
    });

    async function loadAll() {
      const ev = await api('/api/events');
      eventsData = Array.isArray(ev) ? ev : (ev && Array.isArray(ev.upcoming) ? ev.upcoming : []);
      const wf = await api('/api/welfare');
      welfareData = (wf && typeof wf === 'object')
        ? { org: wf.org || [], merchants: wf.merchants || [] }
        : { org: [], merchants: [] };
      renderEvents();
      renderWelfare();
    }

    function field(label, value, oninput, multiline) {
      const wrap = document.createElement('div');
      const lab = document.createElement('label');
      lab.textContent = label;
      const input = multiline ? document.createElement('textarea') : document.createElement('input');
      input.value = value || '';
      input.oninput = () => oninput(input.value);
      wrap.appendChild(lab);
      wrap.appendChild(input);
      return wrap;
    }

    function renderEvents() {
      const list = $('eventsList');
      list.innerHTML = '';
      eventsData.forEach((ev, i) => {
        const box = document.createElement('div');
        box.className = 'item';
        const title = document.createElement('div');
        title.className = 'item-title';
        title.innerHTML = '<span>活動 #' + (i + 1) + '</span>';
        const del = document.createElement('button');
        del.className = 'btn btn-danger';
        del.textContent = '刪除並發佈';
        del.onclick = async () => {
          const label = (ev.name && (ev.name.zh || ev.name.en)) || ('活動 #' + (i + 1));
          if (!confirm('確定刪除已公開內容？\n\n「' + label + '」\n\n刪除後會即刻寫入 GitHub，公開頁約 1–2 分鐘後消失。')) return;
          eventsData.splice(i, 1);
          renderEvents();
          $('eventsMsg').textContent = '正在從公開頁移除…';
          $('eventsMsg').className = 'msg';
          try {
            await api('/api/events', { method: 'PUT', body: JSON.stringify(eventsData) });
            $('eventsMsg').textContent = '已刪除並發佈！公開頁約 1–2 分鐘後更新。';
            $('eventsMsg').className = 'msg ok';
          } catch (e) {
            $('eventsMsg').textContent = '刪除失敗：' + e.message + '（可再撳儲存重試）';
            $('eventsMsg').className = 'msg err';
            await loadAll();
          }
        };
        title.appendChild(del);
        box.appendChild(title);

        const n = ev.name || { zh: '', en: '' };
        const t = ev.tag || { zh: '', en: '' };
        const d = ev.date || { zh: '', en: '' };
        const p = ev.place || { zh: '', en: '' };
        const desc = ev.desc || { zh: '', en: '' };

        const row1 = document.createElement('div');
        row1.className = 'row';
        row1.appendChild(field('名稱（中）', n.zh, (v) => { ev.name = ev.name || {}; ev.name.zh = v; }));
        row1.appendChild(field('名稱（EN）', n.en, (v) => { ev.name = ev.name || {}; ev.name.en = v; }));
        box.appendChild(row1);

        const row2 = document.createElement('div');
        row2.className = 'row';
        row2.appendChild(field('標籤（中）', t.zh, (v) => { ev.tag = ev.tag || {}; ev.tag.zh = v; }));
        row2.appendChild(field('標籤（EN）', t.en, (v) => { ev.tag = ev.tag || {}; ev.tag.en = v; }));
        box.appendChild(row2);

        const row3 = document.createElement('div');
        row3.className = 'row';
        row3.appendChild(field('日期（中）', d.zh, (v) => { ev.date = ev.date || {}; ev.date.zh = v; }));
        row3.appendChild(field('日期（EN）', d.en, (v) => { ev.date = ev.date || {}; ev.date.en = v; }));
        box.appendChild(row3);

        const row4 = document.createElement('div');
        row4.className = 'row';
        row4.appendChild(field('地點（中）', p.zh, (v) => { ev.place = ev.place || {}; ev.place.zh = v; }));
        row4.appendChild(field('地點（EN）', p.en, (v) => { ev.place = ev.place || {}; ev.place.en = v; }));
        box.appendChild(row4);

        box.appendChild(field('簡介（中）', desc.zh, (v) => { ev.desc = ev.desc || {}; ev.desc.zh = v; }, true));
        box.appendChild(field('簡介（EN）', desc.en, (v) => { ev.desc = ev.desc || {}; ev.desc.en = v; }, true));

        list.appendChild(box);
      });
    }

    function emptyEvent() {
      return {
        name: { zh: '', en: '' },
        tag: { zh: '', en: '' },
        date: { zh: '', en: '' },
        place: { zh: '', en: '' },
        desc: { zh: '', en: '' },
      };
    }

    $('btnAddEvent').onclick = () => {
      eventsData.push(emptyEvent());
      renderEvents();
    };

    $('btnSaveEvents').onclick = async () => {
      $('eventsMsg').textContent = '儲存中…';
      $('eventsMsg').className = 'msg';
      try {
        await api('/api/events', { method: 'PUT', body: JSON.stringify(eventsData) });
        $('eventsMsg').textContent = '已儲存！稍等 GitHub Pages 更新（約 1–2 分鐘）。';
        $('eventsMsg').className = 'msg ok';
      } catch (e) {
        $('eventsMsg').textContent = e.message;
        $('eventsMsg').className = 'msg err';
      }
    };

    function renderWelfareItem(listEl, arr, kind) {
      listEl.innerHTML = '';
      arr.forEach((item, i) => {
        const box = document.createElement('div');
        box.className = 'item';
        const title = document.createElement('div');
        title.className = 'item-title';
        title.innerHTML = '<span>' + (kind === 'org' ? '組織' : '商戶') + ' #' + (i + 1) + '</span>';
        const del = document.createElement('button');
        del.className = 'btn btn-danger';
        del.textContent = '刪除並發佈';
        del.onclick = async () => {
          const label = (item.name && (item.name.zh || item.name.en)) || ((kind === 'org' ? '組織' : '商戶') + ' #' + (i + 1));
          if (!confirm('確定刪除已公開內容？\n\n「' + label + '」\n\n刪除後會即刻寫入 GitHub，公開頁約 1–2 分鐘後消失。')) return;
          arr.splice(i, 1);
          renderWelfare();
          $('welfareMsg').textContent = '正在從公開頁移除…';
          $('welfareMsg').className = 'msg';
          try {
            await api('/api/welfare', { method: 'PUT', body: JSON.stringify(welfareData) });
            $('welfareMsg').textContent = '已刪除並發佈！公開頁約 1–2 分鐘後更新。';
            $('welfareMsg').className = 'msg ok';
          } catch (e) {
            $('welfareMsg').textContent = '刪除失敗：' + e.message + '（可再撳儲存重試）';
            $('welfareMsg').className = 'msg err';
            await loadAll();
          }
        };
        title.appendChild(del);
        box.appendChild(title);

        const n = item.name || { zh: '', en: '' };
        const b = item.benefit || { zh: '', en: '' };

        const row1 = document.createElement('div');
        row1.className = 'row';
        row1.appendChild(field('名稱（中）', n.zh, (v) => { item.name = item.name || {}; item.name.zh = v; }));
        row1.appendChild(field('名稱（EN）', n.en, (v) => { item.name = item.name || {}; item.name.en = v; }));
        box.appendChild(row1);

        box.appendChild(field('IG handle（可空，例如 @hkssa）', item.handle || '', (v) => {
          item.handle = v.trim() ? v.trim() : null;
        }));

        box.appendChild(field('優惠（中）', b.zh, (v) => { item.benefit = item.benefit || {}; item.benefit.zh = v; }, true));
        box.appendChild(field('優惠（EN）', b.en, (v) => { item.benefit = item.benefit || {}; item.benefit.en = v; }, true));

        listEl.appendChild(box);
      });
    }

    function renderWelfare() {
      if (!welfareData.org) welfareData.org = [];
      if (!welfareData.merchants) welfareData.merchants = [];
      renderWelfareItem($('orgList'), welfareData.org, 'org');
      renderWelfareItem($('merchantList'), welfareData.merchants, 'merchant');
    }

    function emptyWelfare() {
      return {
        name: { zh: '', en: '' },
        handle: null,
        benefit: { zh: '', en: '' },
      };
    }

    $('btnAddOrg').onclick = () => { welfareData.org.push(emptyWelfare()); renderWelfare(); };
    $('btnAddMerchant').onclick = () => { welfareData.merchants.push(emptyWelfare()); renderWelfare(); };

    $('btnSaveWelfare').onclick = async () => {
      $('welfareMsg').textContent = '儲存中…';
      $('welfareMsg').className = 'msg';
      try {
        await api('/api/welfare', { method: 'PUT', body: JSON.stringify(welfareData) });
        $('welfareMsg').textContent = '已儲存！稍等 GitHub Pages 更新（約 1–2 分鐘）。';
        $('welfareMsg').className = 'msg ok';
      } catch (e) {
        $('welfareMsg').textContent = e.message;
        $('welfareMsg').className = 'msg err';
      }
    };

    // Enter to login
    $('password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') $('btnLogin').click();
    });

    checkSession();
  </script>
</body>
</html>
